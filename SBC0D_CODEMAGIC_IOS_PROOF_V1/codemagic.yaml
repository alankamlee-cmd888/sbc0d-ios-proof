workflows:
  sbc0d-ios-foundation-proof:
    name: SBC-0D iOS Foundation Proof
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.4
      cocoapods: default
      vars:
        RUST_TOOLCHAIN: "1.98.1"
        CARGO_BUILD_JOBS: "1"
        CARGO_INCREMENTAL: "0"
    scripts:
      - name: Run SBC-0D evidence gate
        script: |
          chmod +x "$CM_BUILD_DIR/ci/run_sbc0d_codemagic.sh"
          "$CM_BUILD_DIR/ci/run_sbc0d_codemagic.sh"
    artifacts:
      - artifacts/SBC0D_CODEMAGIC_RESULT_*.zip
      - artifacts/SUMMARY.*
      - workspace/shark-tauri-spike/gen/apple/**/*.app
      - workspace/target/**/*.app
      - /tmp/xcodebuild_logs/*.log
