workflows:
  sbc1-consolidated-apple-proof:
    name: SBC-1 Consolidated Apple Proof
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      xcode: 26.4
      cocoapods: default
      vars:
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $HOME/.npm
    scripts:
      - name: Run consolidated SBC-1 Apple evidence gate
        script: |
          chmod +x "$CM_BUILD_DIR/SBC1E_CODEMAGIC_IOS_PROOF_V1/ci/run_sbc1e_codemagic.sh"
          "$CM_BUILD_DIR/SBC1E_CODEMAGIC_IOS_PROOF_V1/ci/run_sbc1e_codemagic.sh"
    artifacts:
      - artifacts/sbc1/**
      - .sbc1-work/shark-books-community/workspace/shark-tauri-spike/gen/apple/**/*.app
      - /tmp/xcodebuild_logs/*.log
