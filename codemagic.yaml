workflows:
  sbc0d-ios-foundation-proof:
    name: SBC-0D iOS Foundation Proof
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.4
      cocoapods: default
      vars:
        RUST_TOOLCHAIN: "1.98.1"
        CARGO_BUILD_JOBS: "1"
        CARGO_INCREMENTAL: "0"
    scripts:
      - name: Run SBC-0D evidence gate
        script: |
          PKG="$CM_BUILD_DIR/SBC0D_CODEMAGIC_IOS_PROOF_V1"
          chmod +x "$PKG/ci/run_sbc0d_codemagic.sh"
          CM_BUILD_DIR="$PKG" "$PKG/ci/run_sbc0d_codemagic.sh"
    artifacts:
      - SBC0D_CODEMAGIC_IOS_PROOF_V1/artifacts/SBC0D_CODEMAGIC_RESULT_*.zip
      - SBC0D_CODEMAGIC_IOS_PROOF_V1/artifacts/SUMMARY.*
      - SBC0D_CODEMAGIC_IOS_PROOF_V1/workspace/shark-tauri-spike/gen/apple/**/*.app
      - SBC0D_CODEMAGIC_IOS_PROOF_V1/workspace/target/**/*.app
      - /tmp/xcodebuild_logs/*.log
